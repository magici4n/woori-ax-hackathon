<rect x="72" y="55" width="185" height="44" rx="22" fill="#DDEEFF" stroke="none" stroke-width="0"/><text x="164.5" y="84" fill="#0068F5" font-size="21" font-weight="700" text-anchor="middle">02  JOURNEY</text><text x="72" y="172" fill="#09265C" font-size="62" font-weight="800" text-anchor="start">사용자 시나리오</text><text x="75" y="220" fill="#657B9F" font-size="26" font-weight="500" text-anchor="start">자산 확인에서 시작해, 내 의사를 반영한 절세안을 선택합니다</text><rect x="74" y="310" width="550" height="260" rx="25" fill="white" stroke="#D5E3F6" stroke-width="2"/><rect x="74" y="310" width="8" height="260" rx="4" fill="#0068F5"/><text x="106" y="356" fill="#0068F5" font-size="21" font-weight="700" text-anchor="start">01 · 진입</text><text x="106" y="413" fill="#09265C" font-size="34" font-weight="800" text-anchor="start">내 자산 확인</text><text x="106" y="463" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">보유 종목과 평가손익</text><text x="106" y="501" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">현재 예상 양도소득세</text><rect x="685" y="310" width="550" height="260" rx="25" fill="white" stroke="#D5E3F6" stroke-width="2"/><rect x="685" y="310" width="8" height="260" rx="4" fill="#008F84"/><text x="717" y="356" fill="#008F84" font-size="21" font-weight="700" text-anchor="start">02 · 근거</text><text x="717" y="413" fill="#09265C" font-size="34" font-weight="800" text-anchor="start">기업 자료 확인</text><text x="717" y="463" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">기사·공시·원문 링크</text><text x="717" y="501" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">보유·매도 검토 포인트</text><rect x="1296" y="310" width="550" height="260" rx="25" fill="white" stroke="#D5E3F6" stroke-width="2"/><rect x="1296" y="310" width="8" height="260" rx="4" fill="#704FC6"/><text x="1328" y="356" fill="#704FC6" font-size="21" font-weight="700" text-anchor="start">03 · 대화</text><text x="1328" y="413" fill="#09265C" font-size="34" font-weight="800" text-anchor="start">내 조건 말하기</text><text x="1328" y="463" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">“테슬라는 오래 보유할래”</text><text x="1328" y="501" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">AI가 조건 확인·초안 생성</text><rect x="1296" y="665" width="550" height="260" rx="25" fill="white" stroke="#D5E3F6" stroke-width="2"/><rect x="1296" y="665" width="8" height="260" rx="4" fill="#0068F5"/><text x="1328" y="711" fill="#0068F5" font-size="21" font-weight="700" text-anchor="start">04 · 재계산</text><text x="1328" y="768" fill="#09265C" font-size="34" font-weight="800" text-anchor="start">다시 시뮬레이션</text><text x="1328" y="818" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">확인한 조건을 반영</text><text x="1328" y="856" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">Java가 매도 수량·세액 계산</text><rect x="685" y="665" width="550" height="260" rx="25" fill="white" stroke="#D5E3F6" stroke-width="2"/><rect x="685" y="665" width="8" height="260" rx="4" fill="#008F84"/><text x="717" y="711" fill="#008F84" font-size="21" font-weight="700" text-anchor="start">05 · 비교</text><text x="717" y="768" fill="#09265C" font-size="34" font-weight="800" text-anchor="start">3가지 안 비교</text><text x="717" y="818" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">절세액·잔여 자산·근거</text><text x="717" y="856" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">원하는 시나리오 선택</text><rect x="74" y="665" width="550" height="260" rx="25" fill="white" stroke="#D5E3F6" stroke-width="2"/><rect x="74" y="665" width="8" height="260" rx="4" fill="#704FC6"/><text x="106" y="711" fill="#704FC6" font-size="21" font-weight="700" text-anchor="start">06 · 결정</text><text x="106" y="768" fill="#09265C" font-size="34" font-weight="800" text-anchor="start">보고서 확인</text><text x="106" y="818" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">선택한 안의 계산 상세</text><text x="106" y="856" fill="#657B9F" font-size="23" font-weight="500" text-anchor="start">가정과 출처 다시 확인</text><line x1="635" y1="440" x2="665" y2="440" stroke="#0068F5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1246" y1="440" x2="1276" y2="440" stroke="#0068F5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1570" y1="578" x2="1570" y2="648" stroke="#0068F5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1290" y1="795" x2="1262" y2="795" stroke="#0068F5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="679" y1="795" x2="651" y2="795" stroke="#0068F5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="760" y="594" width="400" height="44" rx="22" fill="#DAE9FF" stroke="none" stroke-width="0"/><text x="960.0" y="623" fill="#0068F5" font-size="21" font-weight="700" text-anchor="middle">요구사항이 바뀌면 대화 → 재계산</text><line x1="72" y1="1006" x2="1848" y2="1006" stroke="#D5E3F6" stroke-width="2"/><text x="72" y="1044" fill="#657B9F" font-size="21" font-weight="500" text-anchor="start">사용자의 매도 의사 확인 후 계산 · 주문 실행 기능은 없음</text><text x="1848" y="1044" fill="#0068F5" font-size="21" font-weight="700" text-anchor="end">WON 절세 시나리오 · 해커톤 프로토타입</text></svg>